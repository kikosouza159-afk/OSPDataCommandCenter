<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><title>Cockpit | Login</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden;background:#020814;color:#fff}
.background{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(0,229,255,.16),transparent 30%),radial-gradient(circle at 80% 70%,rgba(0,106,255,.18),transparent 34%),linear-gradient(135deg,#020814 0%,#07172a 50%,#020814 100%);z-index:-1}
.grid{position:absolute;inset:-80px;background-image:linear-gradient(rgba(0,229,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.10) 1px,transparent 1px);background-size:55px 55px;transform:perspective(500px) rotateX(62deg);transform-origin:center bottom;animation:gridMove 5s linear infinite;opacity:.42}
@keyframes gridMove{from{background-position:0 0}to{background-position:0 55px}}
.orb{position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(0,229,255,.10);filter:blur(35px);animation:floatOrb 7s ease-in-out infinite alternate}
.orb.one{top:12%;left:12%}.orb.two{right:10%;bottom:12%;background:rgba(0,102,255,.13);animation-delay:1.5s}
@keyframes floatOrb{from{transform:translate(0,0) scale(1)}to{transform:translate(45px,-30px) scale(1.25)}}
.scanline{position:absolute;left:0;right:0;height:130px;background:linear-gradient(transparent,rgba(0,229,255,.08),transparent);animation:scan 6s ease-in-out infinite}
@keyframes scan{from{top:-150px}to{top:110vh}}
.electric{position:absolute;inset:0;opacity:.35;filter:drop-shadow(0 0 10px rgba(0,229,255,.8))}
.electric svg{width:100%;height:100%}
.electric path{fill:none;stroke:rgba(0,229,255,.45);stroke-width:1.4;stroke-dasharray:12 900;animation:electricRun 3.2s linear infinite}
.electric path:nth-child(2){animation-delay:1.4s;stroke:rgba(0,120,255,.5)}
.electric path:nth-child(3){animation-delay:2.2s;stroke:rgba(120,240,255,.42)}
@keyframes electricRun{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.data-rain{position:absolute;inset:0;overflow:hidden}
.code{position:absolute;top:-120px;font-size:13px;color:rgba(0,229,255,.55);text-shadow:0 0 12px rgba(0,229,255,.8);writing-mode:vertical-rl;letter-spacing:4px;animation:rain linear infinite;user-select:none}
.code:nth-child(1){left:6%;animation-duration:8s;animation-delay:0s}.code:nth-child(2){left:16%;animation-duration:11s;animation-delay:1s}.code:nth-child(3){left:29%;animation-duration:9s;animation-delay:2s}.code:nth-child(4){left:43%;animation-duration:13s;animation-delay:.5s}.code:nth-child(5){left:58%;animation-duration:10s;animation-delay:2.8s}.code:nth-child(6){left:72%;animation-duration:12s;animation-delay:1.7s}.code:nth-child(7){left:88%;animation-duration:8.5s;animation-delay:.8s}
@keyframes rain{from{transform:translateY(-140px);opacity:0}10%{opacity:.9}80%{opacity:.75}to{transform:translateY(120vh);opacity:0}}
.bg-content{position:fixed;inset:0;z-index:-1}

body{display:flex;align-items:center;justify-content:center;overflow:hidden;padding:28px}
.login-shell{position:relative;z-index:2;width:min(1360px,100%);display:grid;grid-template-columns:minmax(420px,1.05fr) minmax(360px,430px);gap:28px;align-items:center}
.login-visual{position:relative;min-height:640px;padding:18px;border-radius:30px;background:linear-gradient(180deg,rgba(6,18,34,.44),rgba(6,18,34,.18));border:1px solid rgba(0,229,255,.14);backdrop-filter:blur(10px);box-shadow:0 0 28px rgba(0,229,255,.08);overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-start}
.mascot-wrap{position:relative;display:flex;justify-content:flex-start;align-items:flex-end;width:100%;height:100%}.mascot-image{width:min(100%,920px);height:auto;object-fit:contain;filter:drop-shadow(0 18px 34px rgba(0,0,0,.35)) drop-shadow(0 0 18px rgba(255,122,0,.14));margin-left:-8px;margin-bottom:-4px}
.login-card{position:relative;z-index:5;width:100%;padding:38px;border-radius:26px;background:rgba(6,18,34,.76);backdrop-filter:blur(18px);border:1px solid rgba(0,229,255,.28);box-shadow:0 0 45px rgba(0,229,255,.18),inset 0 0 30px rgba(255,255,255,.02);animation:cardEntry .8s ease}
@keyframes cardEntry{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.logo{text-align:center;margin-bottom:28px}.olos-login-logo{display:block;width:152px;max-width:70%;height:auto;margin:0 auto 18px;filter:drop-shadow(0 0 14px rgba(255,122,0,.32));}.tag{display:inline-block;margin-bottom:12px;padding:6px 12px;border-radius:999px;background:rgba(0,229,255,.10);border:1px solid rgba(0,229,255,.22);color:#91f3ff;font-size:11px;letter-spacing:1px}
.logo h1{font-size:38px;letter-spacing:3px;color:#fff;text-shadow:0 0 18px rgba(0,229,255,.55)}.logo p{margin-top:10px;color:#9fc2d4;font-size:13px}
.erro{margin-bottom:15px;padding:11px;border-radius:12px;background:rgba(255,70,70,.14);border:1px solid rgba(255,70,70,.40);color:#ffb0b0;text-align:center;font-size:13px}
.input-group{margin-bottom:17px}.input-group label{display:block;margin-bottom:7px;color:#b8d7e8;font-size:13px}.input-group input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid rgba(0,229,255,.28);background:rgba(255,255,255,.07);color:#fff;outline:none;font-size:15px;transition:.25s}.input-group input::placeholder{color:#7694a8}.input-group input:focus{border-color:#00e5ff;box-shadow:0 0 18px rgba(0,229,255,.25);background:rgba(255,255,255,.10)}
.btn-login{width:100%;margin-top:8px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#00e5ff,#0077ff);color:#00111f;font-weight:800;font-size:15px;cursor:pointer;transition:.25s}.btn-login:hover{transform:translateY(-2px);box-shadow:0 0 26px rgba(0,229,255,.48)}.footer{text-align:center;margin-top:22px;color:#6f91a6;font-size:11px}
@media(max-width:1100px){body{padding:20px;overflow:auto}.login-shell{grid-template-columns:1fr;max-width:840px}.login-visual{min-height:unset;padding-bottom:8px}.mascot-wrap{min-height:280px;justify-content:center}.mascot-image{width:min(100%,720px);margin-left:0}.login-card{max-width:520px;margin:0 auto}}@media(max-width:520px){body{padding:16px}.login-visual{padding:22px 18px 8px}.visual-copy h2{font-size:28px}.login-card{padding:30px 24px}.logo h1{font-size:32px}.mascot-image{width:min(100%,720px);margin-left:0}}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/olos_transition.css') }}">
</head><body>{% include "background.html" %}
{% include "_olos_transition.html" %}
<div class="login-shell"><section class="login-visual"><div class="mascot-wrap"><img class="mascot-image" src="{{ url_for('static', filename='img/capivara-dashboard.png') }}" alt="Capivara analisando indicadores"></div></section><form class="login-card" method="POST" data-olos-login-form><div class="logo"><img class="olos-login-logo" src="{{ url_for('static', filename='img/logo-olos-laranja.png') }}" alt="Olos"><span class="tag">OSP COMMAND CENTER</span><h1>COCKPIT</h1><p>Inteligência Operacional • Estratégia • Performance</p></div>
{% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
<div class="input-group"><label>Usuário</label><input type="text" name="usuario" placeholder="Digite seu usuário" required></div>
<div class="input-group"><label>Senha</label><input type="password" name="senha" placeholder="Digite sua senha" required></div>
<button class="btn-login" type="submit">Acessar Cockpit</button><div class="footer">OSP - Olos Strategy and Planning</div></form></div>
<script src="{{ url_for('static', filename='js/olos_transition.js') }}"></script></body></html>
